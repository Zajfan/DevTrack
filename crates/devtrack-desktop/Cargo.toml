[package]
name = "devtrack-desktop"
version = "1.0.0"
edition = "2024"

[features]
# Standalone Cargo builds must use bundled assets. `cargo tauri dev` disables
# this feature automatically when it launches the frontend development server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
devtrack-core = { path = "../devtrack-core" }
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
anyhow = "1"
directories = "6"
walkdir = "2"
rusqlite = "0.40"
opener = "0.7"
tauri-build = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
