# This frontend invokes Tauri IPC and cannot run as a standalone GitHub Pages app.
# Keep web builds available for validation, without publishing a broken app.
name: Web Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace devtrack-web
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-validation
          path: crates/devtrack-web/dist
