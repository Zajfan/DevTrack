name: Android Companion Draft
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing unpublished draft release to receive the APK
        required: true
        default: v1.0.0-draft.1
permissions:
  contents: write
concurrency:
  group: android-companion-draft
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require an existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm test --workspace devtrack-web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:companion --workspace devtrack-web
      - name: Package companion assets
        run: |
          mkdir -p mobile/android/app/src/main/assets
          cp -R crates/devtrack-web/dist-companion/. mobile/android/app/src/main/assets/
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DEVTRACK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/devtrack-android.p12"
          chmod 600 "$RUNNER_TEMP/devtrack-android.p12"
      - name: Build release and test APKs
        working-directory: mobile/android
        env:
          DEVTRACK_ANDROID_KEYSTORE: ${{ runner.temp }}/devtrack-android.p12
          DEVTRACK_ANDROID_STORE_PASSWORD: ${{ secrets.DEVTRACK_ANDROID_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline native launch and persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell cmd connectivity airplane-mode enable
            (cd mobile/android && gradle --no-daemon :app:connectedDebugAndroidTest)
            adb uninstall com.devtrack.companion
            adb install mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.devtrack.companion/.MainActivity
      - name: Attach signed APK to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          cp mobile/android/app/build/outputs/apk/release/app-release.apk DevTrack_1.0.0_android.apk
          gh release upload "$RELEASE_TAG" DevTrack_1.0.0_android.apk --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            mobile/android/app/build/reports
            mobile/android/app/build/outputs/androidTest-results
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/devtrack-android.p12"
