name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            devtrack-ubuntu-latest/*.AppImage
            devtrack-ubuntu-latest/*.deb
            devtrack-windows-latest/*.msi
            devtrack-macos-latest/*.dmg