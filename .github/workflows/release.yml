name: Draft Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v1.0.0-draft.1
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Create or reuse draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "DevTrack 1.0 (draft)" --notes-file docs/releases/1.0.0.md
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")" >> "$GITHUB_OUTPUT"
  desktop:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.draft.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev rpm squashfs-tools
      - run: npm ci
      - run: npm test --workspace devtrack-web
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          projectPath: crates/devtrack-desktop
          tauriScript: npx --no-install tauri
          args: --target ${{ matrix.target }} --ci
          releaseId: ${{ needs.draft.outputs.release_id }}
          tagName: ${{ needs.draft.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          releaseAssetNamePattern: '[name]_[version]_[platform]_[arch][_setup].[ext]'
      - name: Use system Wayland libraries in AppImage
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.draft.outputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          image=$(find target/${{ matrix.target }}/release/bundle/appimage -name '*.AppImage' -print -quit)
          test -n "$image"
          python3 scripts/repair-appimage.py "$image"
          version=$(node -p "require('./crates/devtrack-desktop/tauri.conf.json').version")
          asset="DevTrack_${version}_linux_amd64.AppImage"
          cp "$image" "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber
  checksums:
    needs: [draft, desktop]
    runs-on: ubuntu-22.04
    steps:
      - name: Attach SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.draft.outputs.tag }}
        shell: bash
        run: |
          mkdir assets
          gh release download "$RELEASE_TAG" --dir assets --pattern 'DevTrack*'
          cd assets
          sha256sum * > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
