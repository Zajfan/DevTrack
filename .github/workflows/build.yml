name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - run: npm test --workspace devtrack-web
      - run: npm run build --workspace devtrack-web
      - run: cargo check --workspace --locked
      - name: Core and desktop tests with isolated data
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/devtrack-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/devtrack-config"
          cargo test -p devtrack-core -p devtrack-desktop --locked
